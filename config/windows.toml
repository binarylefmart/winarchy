# Preferencias de ubicación de ventanas de ESTA máquina.
# Se captura con `winarchy layout save` y se reproduce con `winarchy layout apply`.
# El monitor va por device_id porque el índice cambia al reconectar pantallas.
# `pin = true` fija la ventana permanentemente en vez de solo al abrirla.
# `slot` es la posición del tile dentro del workspace (0 = el primero); solo se guarda y
# se aplica en apps con `pin = true`. El resto se ubica al abrir y nadie las reordena.